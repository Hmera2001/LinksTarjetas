<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trébol Boutique • Donde la suerte viste contigo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* Fondo degradado en lavanda suave y elegante */
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 26px 16px;
      background: radial-gradient(circle at 50% 18%, #ede4f7 0%, #d8c2ed 50%, #c4a9df 100%);
      color: #2b213a;
      overflow-x: hidden;
      position: relative;
    }

    /* Aura dorada suave de fondo */
    .gold-glow {
      position: fixed;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, rgba(223, 186, 105, 0.3) 0%, rgba(207, 186, 240, 0.2) 60%, transparent 75%);
      filter: blur(45px);
      z-index: 0;
      pointer-events: none;
    }

    /* Tarjeta principal estilo boutique de lujo */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 34px;
      padding: 36px 22px 28px 22px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(138, 107, 184, 0.22),
                  0 4px 16px rgba(0, 0, 0, 0.04);
      border: 1.5px solid rgba(212, 175, 95, 0.4);
    }

    /* Contenedor del Logo Redondo */
    .avatar-wrapper {
      position: relative;
      width: 124px;
      height: 124px;
      margin: 0 auto 16px auto;
    }

    .avatar-halo {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f5d77f, #cfa853, #b8c09a, #fae29c);
      filter: blur(6px);
      opacity: 0.7;
    }

    .avatar {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #c5a9df;
      border: 2.5px solid #d4af5f;
      display: block;
    }

    /* Tipografía Trébol Boutique */
    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(180deg, #d4a745 0%, #aa7e22 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
      margin-bottom: 2px;
    }

    .sub-brand {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 5px;
      color: #6a5382;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .slogan {
      font-family: 'Cinzel', serif;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #8c734b;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .bio {
      font-size: 0.86rem;
      color: #5c4b6e;
      line-height: 1.45;
      margin-bottom: 20px;
      padding: 0 6px;
    }

    /* Píldoras temáticas en oro y verde salvia */
    .pills {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin-bottom: 22px;
    }

    .pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      background: #f7f3fc;
      border: 1px solid rgba(212, 175, 95, 0.45);
      color: #8c6827;
      letter-spacing: 0.3px;
    }

    /* Botonera */
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 22px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 15px 18px;
      border-radius: 18px;
      text-decoration: none;
      font-size: 0.94rem;
      font-weight: 700;
      color: #ffffff !important;
      position: relative;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      border: none;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn svg {
      width: 21px;
      height: 21px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* WhatsApp */
    .btn-wa {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.25);
    }

    /* Instagram en morado y oro suave */
    .btn-ig {
      background: linear-gradient(135deg, #833ab4 0%, #fd1d1d 50%, #fcb045 100%);
      box-shadow: 0 6px 20px rgba(131, 58, 180, 0.25);
    }

    /* TikTok elegante oscuro */
    .btn-tt {
      background: #1e152a;
      border: 1px solid rgba(212, 175, 95, 0.4);
      box-shadow: 0 6px 18px rgba(30, 21, 42, 0.3);
    }

    .footer {
      border-top: 1px dashed rgba(212, 175, 95, 0.4);
      padding-top: 14px;
      font-size: 0.74rem;
      font-weight: 700;
      color: #8c734b;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
  </style>
</head>
