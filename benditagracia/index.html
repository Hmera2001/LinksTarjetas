<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bendita Gracia • By Marcela Pabón</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 26px 16px;
      background: radial-gradient(circle at 50% 18%, #1f1910 0%, #0d0b08 55%, #050403 100%);
      color: #ffffff;
      overflow-x: hidden;
      position: relative;
    }

    /* Aura dorada de fondo */
    .gold-orb {
      position: fixed;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 330px;
      height: 330px;
      background: radial-gradient(circle, rgba(212, 163, 89, 0.25) 0%, rgba(184, 134, 11, 0.08) 55%, transparent 75%);
      filter: blur(45px);
      z-index: 0;
      pointer-events: none;
    }

    /* Tarjeta principal con bisel dorado fino */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      background: rgba(18, 16, 14, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 32px;
      padding: 36px 22px 28px 22px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85),
                  0 0 35px rgba(212, 163, 89, 0.18);
      border: 1.5px solid rgba(212, 163, 89, 0.35);
    }

    /* Emblema temporal: Corona Dorada */
    .crown-emblem {
      position: relative;
      width: 90px;
      height: 90px;
      margin: 0 auto 14px auto;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #f7d070, #c8963e, #8c6218, #fae29c);
      box-shadow: 0 8px 24px rgba(212, 163, 89, 0.35);
    }

    .crown-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #0d0b08;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .crown-inner svg {
      width: 48px;
      height: 48px;
      fill: url(#goldGrad);
    }

    /* Títulos principales */
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #fff1b8 0%, #e5b95c 40%, #b8860b 80%, #7d5700 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 2px;
      filter: drop-shadow(0 2px 8px rgba(212, 163, 89, 0.3));
    }

    .signature {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.05rem;
      color: #dfba73;
      margin-bottom: 12px;
    }

    .verse {
      font-size: 0.78rem;
      font-style: italic;
      color: #d1c7b7;
      letter-spacing: 0.3px;
      margin-bottom: 20px;
      padding: 0 10px;
      line-height: 1.4;
    }

    /* Sedes físicas */
    .locations-container {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(212, 163, 89, 0.2);
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 22px;
      text-align: left;
    }

    .location-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.76rem;
      color: #e5dec9;
      line-height: 1.35;
    }

    .location-item:first-child {
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px dashed rgba(212, 163, 89, 0.15);
    }

    .location-item span.icon {
      color: #d4a359;
      font-size: 0.9rem;
    }

    /* Botones */
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 22px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 18px;
      border-radius: 16px;
      text-decoration: none;
      font-size: 0.94rem;
      font-weight: 700;
      color: #ffffff !important;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.15s ease, filter 0.15s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn svg {
      width: 21px;
      height: 21px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* Colores de botones */
    .btn-wa {
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.28);
    }

    .btn-ig {
      background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      box-shadow: 0 6px 20px rgba(220, 39, 67, 0.28);
    }

    .btn-tt {
      background: #0a0908;
      border: 1px solid rgba(212, 163, 89, 0.45);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5), 0 0 12px rgba(212, 163, 89, 0.2);
    }

    .footer {
      border-top: 1px solid rgba(212, 163, 89, 0.2);
      padding-top: 14px;
      font-size: 0.74rem;
      font-weight: 700;
      color: #d4a359;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
  </style>
</head>
