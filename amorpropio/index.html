<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amor Propio • 自爱</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@700;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* Fondo degradado suave en tonos rosa pastel */
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 26px 16px;
      background: radial-gradient(circle at 50% 18%, #fde2ec 0%, #f9c9da 50%, #f3aebd 100%);
      color: #1a1a1a;
      overflow-x: hidden;
      position: relative;
    }

    /* Resplandor suave de fondo */
    .pink-glow {
      position: fixed;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 330px;
      height: 330px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.45) 0%, rgba(247, 190, 208, 0.2) 60%, transparent 75%);
      filter: blur(40px);
      z-index: 0;
      pointer-events: none;
    }

    /* Tarjeta principal estilo Kawaii Minimal */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 395px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 32px;
      padding: 36px 22px 28px 22px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(219, 112, 147, 0.16),
                  0 4px 16px rgba(0, 0, 0, 0.05);
      border: 2px solid #fbcfe8;
    }

    /* Contenedor del Logo Panda */
    .avatar-wrapper {
      position: relative;
      width: 118px;
      height: 118px;
      margin: 0 auto 16px auto;
    }

    .avatar-halo {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f472b6, #ec4899, #111111);
      filter: blur(6px);
      opacity: 0.35;
    }

    .avatar {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #f7bed0;
      border: 3px solid #111111;
      display: block;
    }

    /* Caracteres orientales del logo */
    .kanji-title {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 2.1rem;
      font-weight: 900;
      color: #111111;
      letter-spacing: 5px;
      line-height: 1.1;
      margin-bottom: 2px;
    }

    /* Nombre de la marca */
    .brand-name {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #111111;
      margin-bottom: 8px;
    }

    .bio {
      font-size: 0.88rem;
      font-weight: 500;
      color: #64748b;
      line-height: 1.4;
      margin-bottom: 18px;
    }

    /* Píldoras temáticas */
    .tags {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin-bottom: 22px;
    }

    .tag {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      background: #fdf2f8;
      border: 1px solid #fbcfe8;
      color: #db2777;
    }

    /* Botonera */
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 22px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 15px 18px;
      border-radius: 18px;
      text-decoration: none;
      font-size: 0.94rem;
      font-weight: 700;
      color: #ffffff !important;
      position: relative;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      border: none;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn svg {
      width: 21px;
      height: 21px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* WhatsApp */
    .btn-wa {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.25);
    }

    /* Instagram en degradado frambuesa/rosa */
    .btn-ig {
      background: linear-gradient(135deg, #f43f5e 0%, #e11d48 50%, #be123c 100%);
      box-shadow: 0 6px 18px rgba(225, 29, 72, 0.25);
    }

    /* TikTok (Negro panda minimalista) */
    .btn-tt {
      background: #111116;
      box-shadow: 0 6px 18px rgba(17, 17, 22, 0.25);
    }

    .footer {
      border-top: 1px dashed #fbcfe8;
      padding-top: 14px;
      font-size: 0.74rem;
      font-weight: 700;
      color: #db2777;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
  </style>
</head>

</html>
