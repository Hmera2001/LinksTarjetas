<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keré • Chocolatería Artesanal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Montserrat:wght@400;500;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* Fondo cálido crema / manteca de cacao */
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 16px;
      background: radial-gradient(circle at 50% 20%, #fffaf5 0%, #faede2 50%, #f3decb 100%);
      color: #3d2314;
      position: relative;
      overflow-x: hidden;
    }

    /* Resplandor suave terracota */
    .cacao-glow {
      position: fixed;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(224, 122, 70, 0.18) 0%, rgba(224, 122, 70, 0.05) 55%, transparent 75%);
      filter: blur(40px);
      z-index: 0;
      pointer-events: none;
    }

    /* Tarjeta principal artesanal */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 395px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 32px;
      padding: 36px 22px 28px 22px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(184, 86, 36, 0.12),
                  0 4px 16px rgba(61, 35, 20, 0.06);
      border: 1.5px solid #f2cfb8;
    }

    /* Contenedor del Logo con halo terracota */
    .avatar-wrapper {
      position: relative;
      width: 116px;
      height: 116px;
      margin: 0 auto 16px auto;
    }

    .avatar-halo {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f29c6b, #e07a46, #c45b25);
      filter: blur(6px);
      opacity: 0.55;
    }

    .avatar {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: contain;
      padding: 8px;
      background: #ffffff;
      border: 2px solid #f2cfb8;
      display: block;
    }

    /* Títulos y Subtítulos idénticos al logo */
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.1rem;
      font-weight: 700;
      color: #e07a46;
      letter-spacing: 0.5px;
      line-height: 1.1;
      margin-bottom: 2px;
    }

    .sub-brand {
      font-family: 'Playfair Display', serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: #3d2314;
      text-transform: capitalize;
      margin-bottom: 8px;
    }

    .bio {
      font-size: 0.86rem;
      color: #6d5445;
      line-height: 1.4;
      margin-bottom: 22px;
      padding: 0 6px;
    }

    /* Píldoras descriptivas */
    .cacao-tags {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 22px;
    }

    .cacao-tag {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
      background: #fdf3eb;
      border: 1px solid #f2cfb8;
      color: #c45b25;
      letter-spacing: 0.4px;
    }

    /* Botones */
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 22px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 15px 18px;
      border-radius: 16px;
      text-decoration: none;
      font-size: 0.94rem;
      font-weight: 700;
      color: #ffffff !important;
      position: relative;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      border: none;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn svg {
      width: 21px;
      height: 21px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* WhatsApp directo */
    .btn-wa {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.25);
    }

    /* Instagram en tono terracota degradado */
    .btn-ig {
      background: linear-gradient(135deg, #e07a46 0%, #c45b25 50%, #9a3c10 100%);
      box-shadow: 0 6px 20px rgba(224, 122, 70, 0.32);
    }

    /* Facebook */
    .btn-fb {
      background: linear-gradient(135deg, #1877F2 0%, #0d5cb6 100%);
      box-shadow: 0 6px 18px rgba(24, 119, 242, 0.25);
    }

    .footer {
      border-top: 1px dashed #f2cfb8;
      padding-top: 14px;
      font-size: 0.74rem;
      font-weight: 700;
      color: #c45b25;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="cacao-glow"></div>

    <div class="avatar-wrapper">

    <!-- Título y categoría del logo -->
    <h1>Keré</h1>

      <!-- Facebook Oficial -->

    </div>

    <div class="footer">
      🍫 Tarjeta NFC Oficial • Keré

  </div>

</body>
</html>
