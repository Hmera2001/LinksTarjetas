<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cola'o • Coffee Cream</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;1,600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* Fondo degradado cálido tostado / espresso profundo */
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 26px 16px;
      background: radial-gradient(circle at 50% 18%, #2b1810 0%, #170d08 55%, #0c0604 100%);
      color: #fbf7ee;
      overflow-x: hidden;
      position: relative;
    }

    /* Resplandor cálido de fondo */
    .coffee-glow {
      position: fixed;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 330px;
      height: 330px;
      background: radial-gradient(circle, rgba(217, 131, 36, 0.22) 0%, rgba(140, 71, 14, 0.08) 55%, transparent 75%);
      filter: blur(45px);
      z-index: 0;
      pointer-events: none;
    }

    /* Tarjeta principal estilo café bar / cristal tostado */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      background: rgba(28, 17, 12, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 32px;
      padding: 36px 22px 28px 22px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85),
                  0 0 35px rgba(217, 131, 36, 0.16);
      border: 1.5px solid rgba(224, 159, 92, 0.3);
    }

    /* Contenedor del Logo con halo ámbar */
    .avatar-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 16px auto;
    }

    .avatar-halo {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f3c27e, #b86b24, #663309, #fae0b8);
      filter: blur(6px);
      opacity: 0.85;
    }

    /* Imagen del logo ajustada para no desbordar */
    .avatar {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: contain;
      padding: 6px;
      background: #ffffff;
      border: 2px solid rgba(255, 255, 255, 0.8);
      display: block;
    }

    /* Tipografía de la marca */
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fbf7ee;
      margin-bottom: 2px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .sub-brand {
      font-size: 0.84rem;
      font-weight: 800;
      letter-spacing: 3.5px;
      color: #e09f5c;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .tagline {
      font-size: 0.88rem;
      color: #d6c7b2;
      line-height: 1.4;
      margin-bottom: 20px;
      padding: 0 8px;
    }

    /* Píldoras temáticas */
    .pills {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(224, 159, 92, 0.12);
      border: 1px solid rgba(224, 159, 92, 0.28);
      color: #f3c27e;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    /* Botonera */
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 22px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 15px 18px;
      border-radius: 16px;
      text-decoration: none;
      font-size: 0.94rem;
      font-weight: 700;
      color: #ffffff !important;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.15s ease, filter 0.15s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn svg {
      width: 21px;
      height: 21px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* Botón WhatsApp */
    .btn-wa {
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.28);
    }

    /* Botón Instagram */
    .btn-ig {
      background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      box-shadow: 0 6px 20px rgba(220, 39, 67, 0.28);
    }

    /* Botón TikTok */
    .btn-tt {
      background: #0f0a07;
      border: 1px solid rgba(224, 159, 92, 0.4);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5), 0 0 12px rgba(224, 159, 92, 0.2);
    }
    .btn-maps {
      background: linear-gradient(135deg, #c27d38 0%, #8c4a16 100%);
      border: 1px solid rgba(243, 194, 126, 0.35);
      box-shadow: 0 6px 20px rgba(194, 125, 56, 0.3);
    }

    .footer {
      border-top: 1px solid rgba(224, 159, 92, 0.18);
      padding-top: 14px;
      font-size: 0.74rem;
      font-weight: 700;
      color: #e09f5c;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
  </style>
</head>
