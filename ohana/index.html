<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OHANA • Anime, Juguetes y Peluches</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* Fondo degradado estilo Sol Naciente / Tinta */
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 26px 16px;
      background: radial-gradient(circle at 50% 15%, #2a0b0e 0%, #15090b 45%, #080708 100%);
      color: #ffffff;
      overflow-x: hidden;
      position: relative;
    }

    /* Resplandor carmesí de fondo */
    .sun-glow {
      position: fixed;
      top: 5%;
      left: 50%;
      transform: translateX(-50%);
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, rgba(214, 40, 40, 0.35) 0%, rgba(186, 24, 27, 0.12) 55%, transparent 75%);
      filter: blur(45px);
      z-index: 0;
      pointer-events: none;
    }

    /* Tarjeta estilo cristal oscuro con borde rojo */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      background: rgba(18, 17, 22, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 32px;
      padding: 36px 22px 28px 22px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8),
                  0 0 35px rgba(214, 40, 40, 0.22);
      border: 1.5px solid rgba(214, 40, 40, 0.35);
    }

    /* Contenedor del Logo */
    .avatar-wrapper {
      position: relative;
      width: 118px;
      height: 118px;
      margin: 0 auto 16px auto;
    }

    .avatar-halo {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e63946, #ba181b, #660708);
      filter: blur(8px);
      opacity: 0.85;
    }

    /* Ajuste para que el círculo completo del logo encaje perfecto */
    .avatar {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: contain;
      padding: 3px;
      background: #ffffff;
      border: 2.5px solid #d62828;
      display: block;
    }

    /* Tipografía OHANA */
    h1 {
      font-size: 1.85rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 2px;
      text-shadow: 0 2px 12px rgba(214, 40, 40, 0.5);
    }

    /* Subtítulo exacto del logo */
    .sub-brand {
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 2.5px;
      color: #e63946;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .handle {
      font-size: 0.82rem;
      font-weight: 600;
      color: #a8a29e;
      letter-spacing: 0.4px;
      margin-bottom: 14px;
    }

    /* Categorías estilo tags */
    .tags-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-bottom: 16px;
    }

    .tag {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 11px;
      border-radius: 999px;
      background: rgba(214, 40, 40, 0.12);
      border: 1px solid rgba(214, 40, 40, 0.3);
      color: #fca5a5;
      letter-spacing: 0.2px;
    }

    .bio {
      font-size: 0.86rem;
      font-weight: 500;
      color: #e5e5e5;
      line-height: 1.4;
      margin-bottom: 22px;
    }

    /* Botones */
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 22px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 18px;
      border-radius: 16px;
      text-decoration: none;
      font-size: 0.94rem;
      font-weight: 700;
      color: #ffffff !important;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.15s ease, filter 0.15s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn svg {
      width: 21px;
      height: 21px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* Botón WhatsApp */
    .btn-wa {
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.28);
    }

    /* Botón TikTok (Negro mate con borde carmesí) */
    .btn-tt {
      background: #09090b;
      border-color: rgba(230, 57, 70, 0.45);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5), 0 0 12px rgba(230, 57, 70, 0.25);
    }

    /* Botón Instagram */
    .btn-ig {
      background: linear-gradient(135deg, #e63946 0%, #b5179e 50%, #7209b7 100%);
      box-shadow: 0 6px 20px rgba(230, 57, 70, 0.32);
    }

    /* Botón Facebook */
    .btn-fb {
      background: linear-gradient(135deg, #1877F2 0%, #0d5cb6 100%);
      box-shadow: 0 6px 20px rgba(24, 119, 242, 0.28);
    }

    .footer {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 14px;
      font-size: 0.74rem;
      font-weight: 700;
      color: #e63946;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }
  </style>
</head>
