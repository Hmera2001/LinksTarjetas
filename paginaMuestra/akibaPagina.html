<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akiiba Store ✨</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', 'Comfortaa', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* Fondo rosa pastel con corazoncitos sutiles */
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 16px;
      background: radial-gradient(circle at 50% 30%, #fff0f5 0%, #fde2ec 50%, #fbcfe8 100%);
      color: #b91c1c;
      overflow-x: hidden;
      position: relative;
    }

    /* Tarjeta Kawaii */
    .card {
      position: relative;
      width: 100%;
      max-width: 390px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 34px;
      padding: 34px 22px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(244, 63, 94, 0.15),
                  0 4px 12px rgba(251, 113, 133, 0.1);
      border: 3px solid #fecdd3;
    }

    /* Avatar con marco rosado circular */
    .avatar-wrapper {
      position: relative;
      width: 105px;
      height: 105px;
      margin: 0 auto 14px auto;
    }

    .avatar-border {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fb7185, #f43f5e, #fda4af);
      filter: blur(4px);
      opacity: 0.6;
    }

    .avatar {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #ffffff;
      background: #fff;
      display: block;
    }

    /* Título llamativo estilo imagen */
    h1 {
      font-size: 1.65rem;
      font-weight: 700;
      color: #9f1239;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .slogan {
      font-size: 0.95rem;
      font-weight: 600;
      color: #be123c;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .sub-slogan {
      font-size: 0.85rem;
      font-weight: 500;
      color: #db2777;
      margin-bottom: 24px;
    }

    /* Lista de Botones */
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 13px;
      margin-bottom: 22px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 18px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 0.96rem;
      font-weight: 700;
      color: #ffffff !important;
      position: relative;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      border: none;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* Botón Catálogo / Productos Destacado */
    .btn-catalog {
      background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      box-shadow: 0 8px 22px rgba(244, 63, 94, 0.35);
    }

    /* WhatsApp directo para pedidos */
    .btn-wa {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.28);
    }

    /* Instagram de la tienda */
    .btn-ig {
      background: linear-gradient(135deg, #f43f5e 0%, #d946ef 50%, #8b5cf6 100%);
      box-shadow: 0 6px 18px rgba(217, 70, 239, 0.28);
    }

    /* TikTok donde muestran los productos */
    .btn-tt {
      background: #18181b;
      box-shadow: 0 6px 18px rgba(24, 24, 27, 0.25);
    }

    /* Decoraciones flotantes */
    .sparkle {
      display: inline-block;
      margin: 0 4px;
    }

    .footer {
      border-top: 1px dashed #fecdd3;
      padding-top: 14px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #f43f5e;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- Logo o ilustración circular de la tienda -->
    <div class="avatar-wrapper">
      <div class="avatar-border"></div>
      <img class="avatar" src="logoakiiba.png" alt="Akiiba Store Logo">
    </div>

    <!-- Títulos basados en su imagen -->
    <h1>Akiiba Store <span class="sparkle">🌸</span></h1>

    <p class="sub-slogan">Figuras, Llaveros, Accesorios & Coleccionables Anime</p>

    <div class="btn-container">

      <!-- Instagram Catálogo / Novedades -->
      <a class="btn btn-ig" href="https://instagram.com/akiibastore" target="_blank">

        Síguenos en Instagram
      </a>

      <!-- Botón Catálogo PDF o Galería de Fotos -->
      <a class="btn btn-catalog" href="#" target="_blank">
        🛍️ Ver Catálogo de Productos
      </a>

    </div>

    <div class="footer">
      💖 Tarjeta NFC Oficial • Akiiba Store
    </div>

  </div>

</body>
</html>
