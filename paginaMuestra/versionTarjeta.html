<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canales Oficiales</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #080808;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 26px 16px;
      color: #ffffff;
    }

    /* Chasis idéntico a la tarjeta física */
    .card {
      position: relative;
      width: 100%;
      max-width: 410px;
      background-color: #121212;
      border-radius: 30px;
      padding: 44px 22px 30px 22px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    /* Esquinas geométricas de doble línea */
    .corner-top-right {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 46px;
      height: 46px;
      pointer-events: none;
    }

    .corner-bottom-left {
      position: absolute;
      bottom: 18px;
      left: 18px;
      width: 46px;
      height: 46px;
      pointer-events: none;
    }

    /* Avatar / Logo con borde estilizado en blanco */
    .avatar-wrapper {
      position: relative;
      width: 86px;
      height: 86px;
      margin: 0 auto 16px auto;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ffffff;
      background: #1c1c1c;
      display: block;
    }

    /* Textos principales */
    h1 {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 0.8rem;
      font-weight: 500;
      color: #a3a3a3;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    /* Barra vertical divisoria blanca */
    .vertical-divider {
      width: 2px;
      height: 22px;
      background-color: #ffffff;
      margin: 0 auto 24px auto;
      border-radius: 2px;
      opacity: 0.85;
    }

    /* Lista de Botones */
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: #ffffff !important;
      background: #1c1c1c;
      border: 1px solid rgba(255, 255, 255, 0.14);
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .btn:active {
      transform: scale(0.97);
      background: #262626;
      border-color: rgba(255, 255, 255, 0.4);
    }

    .btn svg {
      width: 21px;
      height: 21px;
      fill: #ffffff;
      flex-shrink: 0;
    }

    /* Acentos sutiles para identificar cada red sin romper el estilo monocromático */
    .btn-wa:hover, .btn-wa:active { border-color: #25D366; }
    .btn-ig:hover, .btn-ig:active { border-color: #E1306C; }
    .btn-tt:hover, .btn-tt:active { border-color: #00f2fe; }
    .btn-fb:hover, .btn-fb:active { border-color: #1877F2; }
    .btn-maps:hover, .btn-maps:active { border-color: #f59e0b; }

    /* Pie de página para promocionar tus tarjetas */
    .footer-ad {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 16px;
      margin-top: 8px;
    }

    .footer-ad p {
      font-size: 0.75rem;
      font-weight: 600;
      color: #737373;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .footer-ad a {
      font-size: 0.92rem;
      font-weight: 800;
      color: #ffffff;
      text-decoration: none;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
