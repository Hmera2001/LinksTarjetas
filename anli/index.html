<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anli Jugueteria | ¡Mundo de Diversión!</title>
    
    <!-- Google Fonts: Quicksand & Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#FFFDF7',
                        magenta: '#E8296F',
                        magentadark: '#C91A5A',
                        gold: '#F6B828',
                        wapp: '#25D366',
                        wappdark: '#1DA851',
                        textbrown: '#4A3543'
                    },
                    fontFamily: {
                        quicksand: ['Quicksand', 'sans-serif'],
                        nunito: ['Nunito', 'sans-serif']
                    },
                    animation: {
                        'float': 'float 4s ease-in-out infinite',
                        'twinkle': 'twinkle 3s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-12px)' },
                        },
                        twinkle: {
                            '0%, 100%': { opacity: 0.3, transform: 'scale(0.7)' },
                            '50%': { opacity: 1, transform: 'scale(1.2)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #f3f4f6; /* Fondo gris para el exterior (escritorio) */
            display: flex;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        /* Contenedor móvil central */
        .mobile-container {
            width: 100%;
            max-width: 400px;
            background-color: #FFFDF7;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        /* Ocultar scrollbar para estética móvil */
        .mobile-container::-webkit-scrollbar { display: none; }
        .mobile-container { -ms-overflow-style: none; scrollbar-width: none; }

        /* Botones estilo burbuja / 3D */
        .bubble-btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 1.1rem 1.5rem;
            border-radius: 9999px;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 1.15rem;
            transition: all 0.15s ease-out;
            border: 3px solid rgba(255, 255, 255, 0.3);
            text-decoration: none;
            overflow: hidden;
        }

        .bubble-btn::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 10%;
            width: 80%;
            height: 30%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.6), rgba(255,255,255,0));
            border-radius: 9999px;
            pointer-events: none;
        }

        /* Sombra estática que da el efecto 3D */
        .btn-instagram {
            background-color: #E8296F;
            color: white;
            box-shadow: 0 6px 0 #C91A5A, 0 15px 20px rgba(232, 41, 111, 0.3);
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: white;
            box-shadow: 0 6px 0 #1DA851, 0 15px 20px rgba(37, 211, 102, 0.3);
        }

        /* Efecto al presionar (click / touch) */
        .bubble-btn:active {
            transform: translateY(6px);
        }
        
        .btn-instagram:active {
            box-shadow: 0 0px 0 #C91A5A, 0 5px 10px rgba(232, 41, 111, 0.3);
        }

        .btn-whatsapp:active {
            box-shadow: 0 0px 0 #1DA851, 0 5px 10px rgba(37, 211, 102, 0.3);
        }

        /* Destellos mágicos del fondo */
        .sparkle {
            position: absolute;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body class="font-nunito text-textbrown">

    <main class="mobile-container flex flex-col items-center min-h-screen pb-12">
        
        <!-- Elementos Mágicos del Fondo (CSS Puro) -->
        <div class="absolute inset-0 overflow-hidden pointer-events-none z-0" aria-hidden="true">
            <!-- Arriba Izquierda (Rosado) -->
            <svg class="sparkle animate-twinkle text-magenta/40 w-6 h-6 top-10 left-8" style="animation-delay: 0s;" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0l2.5 8.5L23 11l-8.5 2.5L12 22l-2.5-8.5L1 11l8.5-2.5z"/></svg>
            <!-- Arriba Derecha (Dorado) -->
            <svg class="sparkle animate-twinkle text-gold/60 w-8 h-8 top-16 right-6" style="animation-delay: 1.2s;" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0l2.5 8.5L23 11l-8.5 2.5L12 22l-2.5-8.5L1 11l8.5-2.5z"/></svg>
            <!-- Centro Izquierda (Dorado) -->
            <svg class="sparkle animate-twinkle text-gold/50 w-5 h-5 top-[35%] left-10" style="animation-delay: 0.5s;" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0l2.5 8.5L23 11l-8.5 2.5L12 22l-2.5-8.5L1 11l8.5-2.5z"/></svg>
            <!-- Centro Derecha (Rosado) -->
            <svg class="sparkle animate-twinkle text-magenta/30 w-7 h-7 top-[45%] right-8" style="animation-delay: 2.1s;" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0l2.5 8.5L23 11l-8.5 2.5L12 22l-2.5-8.5L1 11l8.5-2.5z"/></svg>
            <!-- Abajo Izquierda (Rosado) -->
            <svg class="sparkle animate-twinkle text-magenta/50 w-8 h-8 bottom-[20%] left-6" style="animation-delay: 1.8s;" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0l2.5 8.5L23 11l-8.5 2.5L12 22l-2.5-8.5L1 11l8.5-2.5z"/></svg>
            <!-- Abajo Derecha (Dorado) -->
            <svg class="sparkle animate-twinkle text-gold/40 w-5 h-5 bottom-[10%] right-12" style="animation-delay: 0.9s;" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0l2.5 8.5L23 11l-8.5 2.5L12 22l-2.5-8.5L1 11l8.5-2.5z"/></svg>
            
            <!-- Círculos decorativos desenfocados -->
            <div class="absolute top-[-50px] left-[-50px] w-40 h-40 bg-magenta/10 rounded-full blur-3xl"></div>
            <div class="absolute top-[40%] right-[-70px] w-48 h-48 bg-gold/10 rounded-full blur-3xl"></div>
        </div>

        <!-- Cabecera y Logo -->
        <header class="w-full flex flex-col items-center pt-16 px-6 z-10">
            <div class="w-64 h-64 mb-4 relative flex items-center justify-center animate-float drop-shadow-2xl">
                <!-- Se utiliza el archivo exacto solicitado -->
                <img src="logoangie.jpeg" alt="Anli Jugueteria Logo" class="w-full h-full object-contain">
            </div>
            
            <h1 class="font-quicksand font-bold text-3xl text-center text-magenta leading-tight mt-2 drop-shadow-sm">
                ¡Bienvenidos a <br> la magia!
            </h1>
            <p class="text-center font-nunito font-bold text-textbrown/70 mt-3 text-[15px] px-4">
                El rincón donde los sueños de los más pequeños se hacen realidad. ✨
            </p>
        </header>

        <!-- Botones de Acción -->
        <section class="w-full px-8 mt-10 z-10 flex flex-col gap-6">
            
            <!-- Botón Instagram -->
            <a href="https://www.instagram.com/anli.jugueteria_" target="_blank" class="bubble-btn btn-instagram">
                <i class="ph-fill ph-instagram-logo text-3xl"></i>
                <span>Síguenos en Instagram</span>
            </a>

            <!-- Botón WhatsApp -->
            <a href="https://wa.me/573203184747" target="_blank" class="bubble-btn btn-whatsapp">
                <i class="ph-fill ph-whatsapp-logo text-3xl"></i>
                <span>Escríbenos al WhatsApp</span>
            </a>

        </section>

        <!-- Footer Decorativo -->
        <footer class="w-full text-center mt-auto pt-16 z-10 pb-4">
            <div class="flex items-center justify-center gap-2 mb-2">
                <div class="w-1.5 h-1.5 rounded-full bg-gold"></div>
                <div class="w-1.5 h-1.5 rounded-full bg-magenta"></div>
                <div class="w-1.5 h-1.5 rounded-full bg-gold"></div>
            </div>
            <p class="font-nunito font-bold text-[12px] text-textbrown/50">
                © Anli Juguetería. Todos los derechos reservados.
            </p>
        </footer>

    </main>

</body>
</html>
