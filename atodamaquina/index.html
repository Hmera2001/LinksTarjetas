<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Toda Máquina • Pasión por los Motores</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,700;0,800;0,900;1,800;1,900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* Fondo degradado deportivo y automotriz */
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 26px 16px;
      background: radial-gradient(circle at 50% 16%, #2b0608 0%, #120304 50%, #08080a 100%);
      color: #ffffff;
      overflow-x: hidden;
      position: relative;
    }

    /* Resplandor rojo de velocidad */
    .speed-glow {
      position: fixed;
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(255, 30, 39, 0.28) 0%, rgba(180, 10, 18, 0.1) 55%, transparent 75%);
      filter: blur(45px);
      z-index: 0;
      pointer-events: none;
    }

    /* Tarjeta principal estilo Racing / Cristal oscuro */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 405px;
      background: rgba(15, 15, 18, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 32px 20px 28px 20px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9),
                  0 0 35px rgba(255, 30, 39, 0.22);
      border: 1.5px solid rgba(255, 30, 39, 0.4);
    }

    /* Contenedor del Logo Panorámico */
    .banner-wrapper {
    position: relative;
    width: 100%;
    background: #ffffff;
    border-radius: 20px;
    padding: 6px 8px; /* Reducimos el padding interno para ganar espacio */
    margin-bottom: 18px;
    border: 2px solid #ff1e27;
    box-shadow: 0 8px 24px rgba(255, 30, 39, 0.25);
    overflow: hidden; /* Corta bordes sobrantes */
    }

    .banner-img {
    width: 100%;
    height: auto;
    max-height: 185px; /* Aumentamos la altura visible */
    object-fit: contain;
    transform: scale(1.60); /* Hace zoom para quitar los márgenes vacíos de la imagen */
    display: block;
    }

    /* Título y subtítulos */
    .brand-title {
      font-size: 1.85rem;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 0%, #ff4d53 60%, #ff1e27 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
      margin-bottom: 2px;
      filter: drop-shadow(0 2px 8px rgba(255, 30, 39, 0.4));
    }

    .sub-brand {
      font-size: 0.84rem;
      font-weight: 800;
      letter-spacing: 4px;
      color: #ff1e27;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .bio {
      font-size: 0.88rem;
      color: #d1d5db;
      line-height: 1.45;
      margin-bottom: 18px;
      padding: 0 4px;
    }

    /* Píldoras temáticas Motorsport */
    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-bottom: 22px;
    }

    .tag {
      font-size: 0.72rem;
      font-weight: 800;
      font-style: italic;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(255, 30, 39, 0.12);
      border: 1px solid rgba(255, 30, 39, 0.35);
      color: #ff4d53;
      letter-spacing: 0.5px;
    }

    /* Botonera */
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 22px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 15px 18px;
      border-radius: 18px;
      text-decoration: none;
      font-size: 0.94rem;
      font-weight: 700;
      color: #ffffff !important;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn svg {
      width: 21px;
      height: 21px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* WhatsApp Racing */
    .btn-wa {
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.28);
    }

    /* Instagram */
    .btn-ig {
      background: linear-gradient(135deg, #ff1e27 0%, #c10f17 50%, #7d040a 100%);
      border: 1px solid #ff4d53;
      box-shadow: 0 6px 20px rgba(255, 30, 39, 0.35);
    }

    /* TikTok Dark Motorsport */
    .btn-tt {
      background: #08080a;
      border: 1px solid rgba(255, 30, 39, 0.45);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
    }

    .footer {
      border-top: 1px dashed rgba(255, 30, 39, 0.3);
      padding-top: 14px;
      font-size: 0.74rem;
      font-weight: 800;
      color: #ff1e27;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="speed-glow"></div>

    <div class="banner-wrapper">

    </div>

    <div class="footer">
      🏁 Tarjeta NFC Oficial • A Toda Máquina
    </div>

  </div>

</body>
</html>
