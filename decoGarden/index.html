<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deco Garden • Jardinería y Decoración</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* Fondo degradado botánico profundo */
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 16px;
      background: radial-gradient(circle at 50% 25%, #183d2b 0%, #0d2318 60%, #06120c 100%);
      color: #ffffff;
      position: relative;
      overflow-x: hidden;
    }

    /* Tarjeta estilo invernadero premium / cristal oscuro */
    .card {
      position: relative;
      width: 100%;
      max-width: 400px;
      background: rgba(18, 43, 30, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 38px 22px 30px 22px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.65),
                  0 0 35px rgba(46, 117, 89, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* Contenedor del Logo con halo vegetal */
    .avatar-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 16px auto;
    }

    .avatar-glow {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(135deg, #52b788, #b7e4c7, #d4a373);
      filter: blur(6px);
      opacity: 0.75;
    }

    .avatar {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: contain; /* Ajusta la imagen entera dentro del círculo sin recortarla */
    padding: 10px;        /* Espacio interno para que respire y se vea más pequeño */
    background: #ffffff;  /* Fondo blanco o neutro para que contraste si es transparente */
    border: 2px solid #ffffff;
    display: block;
    }

    /* Títulos elegantes */
    .brand-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.85rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 1px;
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .brand-subtitle {
      font-size: 0.78rem;
      font-weight: 600;
      color: #b7e4c7;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      margin-bottom: 8px;
    }

    .bio {
      font-size: 0.88rem;
      color: #cbd5e1;
      line-height: 1.4;
      margin-bottom: 24px;
    }

    /* Botones de interacción */
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 22px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 15px 18px;
      border-radius: 16px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.94rem;
      color: #ffffff !important;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: transform 0.15s ease, filter 0.15s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn svg {
      width: 21px;
      height: 21px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* Estilos temáticos para cada red */
    .btn-wa {
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.3);
    }

    .btn-ig {
      background: linear-gradient(135deg, #f72585 0%, #7209b7 50%, #4361ee 100%);
      box-shadow: 0 6px 20px rgba(247, 37, 133, 0.3);
    }

    .btn-tt {
      background: #09090b;
      border-color: rgba(255, 255, 255, 0.22);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .btn-fb {
      background: linear-gradient(135deg, #1877F2 0%, #0a4ebd 100%);
      box-shadow: 0 6px 20px rgba(24, 119, 242, 0.3);
    }

    /* Pie de página con sello natural */
    .footer {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 14px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #74c69d;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
  </style>
</head>
