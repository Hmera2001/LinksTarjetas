<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emisora Santander estereo 102.7</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f1f5f9;
      color: #0f172a;
      display: flex;
      justify-content: center;
      padding: 35px 18px;
      min-height: 100vh;
    }
    .card {
      width: 100%;
      max-width: 390px;
      background: #ffffff;
      padding: 28px 20px;
      border-radius: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      text-align: center;
      height: fit-content;
    }
    .avatar {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 14px;
      border: 3px solid #e2e8f0;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .bio {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 24px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 12px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      transition: transform 0.15s ease, filter 0.15s ease;
      color: #ffffff;
    }
    .btn:active {
      transform: scale(0.98);
      filter: brightness(0.9);
    }
    .btn-wa { background-color: #25D366; }
    .btn-ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .btn-fb { background-color: #1877F2; }
    .btn-maps { background-color: #0F9D58; }
    .btn-menu { background-color: #1e293b; }
    .footer {
      margin-top: 20px;
      font-size: 0.75rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Reemplaza con la URL del logo del cliente (puedes subir la foto al mismo repo) -->
    <img class="avatar" src="https://ui-avatars.com/api/?name=El+Porton&background=0f172a&color=fff&size=128" alt="Logo">
    
    <h1>Restaurante El Portón</h1>
    <p class="bio">¡Conéctate con nosotros en un toque!</p>

    <!-- Botón WhatsApp con mensaje automático -->
    <a class="btn btn-wa" href="https://wa.me/573001234567?text=Hola,%20quiero%20hacer%20un%20pedido" target="_blank">
      💬 Escríbenos al WhatsApp
    </a>

    <!-- Botón Instagram -->
    <a class="btn btn-ig" href="https://instagram.com/usuario_negocio" target="_blank">
      📸 Síguenos en Instagram
    </a>

    <!-- Botón Facebook -->
    <a class="btn btn-fb" href="https://santanderstereofm1027.com/" target="_blank">
      Escuchanos
    </a>

    <!-- Botón Calificar en Google Maps -->
    <a class="btn btn-maps" href="https://maps.google.com" target="_blank">
      ⭐ Déjanos tu opinión en Google
    </a>

    <!-- Botón opcional para Menú en PDF o Catálogo -->
    <!-- <a class="btn btn-menu" href="#" target="_blank">📋 Ver Menú Digital</a> -->

    <div class="footer">
      Contacto Digital NFC
    </div>
  </div>

</body>
</html>
