<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tardes de Luna • Cafe Bar</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* Fondo degradado nocturno café bar */
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 26px 16px;
      background: radial-gradient(circle at 50% 16%, #2b170e 0%, #150b06 55%, #080402 100%);
      color: #faeed9;
      overflow-x: hidden;
      position: relative;
    }

    /* Luz cálida de fondo lunar */
    .moon-glow {
      position: fixed;
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.25) 0%, rgba(180, 83, 9, 0.08) 55%, transparent 75%);
      filter: blur(45px);
      z-index: 0;
      pointer-events: none;
    }

    /* Tarjeta principal estilo chapa de madera / café bar nocturno */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      background: rgba(22, 13, 8, 0.92);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-radius: 34px;
      padding: 36px 22px 28px 22px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9),
                  0 0 35px rgba(245, 158, 11, 0.2);
      border: 1.5px solid rgba(245, 158, 11, 0.4);
    }

    /* Contenedor del Logo Redondo con halo iluminado */
    .avatar-wrapper {
      position: relative;
      width: 130px;
      height: 130px;
      margin: 0 auto 16px auto;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #fbbf24, #d97706, #78350f, #f59e0b);
      box-shadow: 0 8px 28px rgba(245, 158, 11, 0.35);
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #140d09;
      padding: 2px;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    /* Tipografía Tardes de Luna */
    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(180deg, #fde68a 0%, #f59e0b 60%, #b45309 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
      margin-bottom: 2px;
      text-shadow: 0 2px 10px rgba(245, 158, 11, 0.3);
    }

    .sub-brand {
      font-family: 'Cinzel', serif;
      font-size: 0.86rem;
      font-weight: 700;
      letter-spacing: 5px;
      color: #f59e0b;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .slogan {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 0.95rem;
      color: #e5cfb3;
      margin-bottom: 18px;
    }

    /* Píldoras temáticas */
    .pills {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin-bottom: 22px;
    }

    .pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fbbf24;
      letter-spacing: 0.4px;
    }

    /* Botonera */
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 22px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 15px 18px;
      border-radius: 18px;
      text-decoration: none;
      font-size: 0.94rem;
      font-weight: 700;
      color: #ffffff !important;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn svg {
      width: 21px;
      height: 21px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* Botón Menú Destacado en Ámbar Tostado */
    .btn-menu {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 50%, #92400e 100%);
      color: #170d06 !important;
      font-weight: 800;
      border: 1px solid #fde68a;
      box-shadow: 0 6px 22px rgba(245, 158, 11, 0.35);
    }
    .btn-menu svg {
      fill: #170d06;
    }

    /* WhatsApp */
    .btn-wa {
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.28);
    }

    /* Instagram */
    .btn-ig {
      background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      box-shadow: 0 6px 20px rgba(220, 39, 67, 0.28);
    }

    /* TikTok Café Nocturno */
    .btn-tt {
      background: #140d09;
      border: 1px solid rgba(245, 158, 11, 0.4);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
    }

    .footer {
      border-top: 1px dashed rgba(245, 158, 11, 0.25);
      padding-top: 14px;
      font-size: 0.74rem;
      font-weight: 700;
      color: #f59e0b;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
  </style>
</head>

    <div class="footer">

  </div>

</body>
</html>
